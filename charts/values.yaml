hostNetwork: false
controllerManager:
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    # Default New Relic account ID applied to resources that omit spec.accountId
    # (rendered as the NEW_RELIC_ACCOUNT_ID env var). Requires webhooks to be enabled.
    # Accepts a number or a string (e.g. 1234567 or "1234567").
    defaultAccountId: ""
    # Alternatively, read the default account ID from a Secret. When both name and
    # key are set, this takes precedence over defaultAccountId.
    defaultAccountIdSecret:
      name: ""
      key: ""
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    image:
      repository: newrelic/newrelic-k8s-operator-v2
      tag: latest
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
  replicas: 1
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  affinity: {}
  tolerations: []
  nodeSelector: {}
kubernetesClusterDomain: cluster.local
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
webhookService:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  type: ClusterIP
